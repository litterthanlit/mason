name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck app
        run: npm run typecheck
      - name: Typecheck Convex functions
        run: npm run typecheck:convex
      - name: Backend tests
        run: npm test
